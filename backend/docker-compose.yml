services:
  postgres:
    image: postgres:16-alpine
    container_name: worknear-postgres
    environment:
      POSTGRES_DB: worknear
      POSTGRES_USER: worknear
      POSTGRES_PASSWORD: worknear
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worknear"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: worknear-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: worknear-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/worknear
      DB_USERNAME: worknear
      DB_PASSWORD: worknear
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change-me-in-prod-this-is-a-dev-only-secret-key-please-rotate-1234567890
    ports:
      - "8080:8080"

volumes:
  pgdata:
