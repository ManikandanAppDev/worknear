spring:
  application:
    name: worknear-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/worknear}
    username: ${DB_USERNAME:worknear}
    password: ${DB_PASSWORD:worknear}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate neither creates nor validates it.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

worknear:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-this-is-a-dev-only-secret-key-please-rotate-1234567890}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL:60}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL:30}
    issuer: worknear
  otp:
    length: 4
    ttl-seconds: 300
    # When mock=true, OTP is fixed and returned in the response (dev only, no SMS sent)
    mock: ${OTP_MOCK:true}
    mock-code: "4821"
    max-attempts: 5
  payment:
    # When mock=true, payment orders are auto-marked capturable without a real gateway
    mock: ${PAYMENT_MOCK:true}
    platform-commission-percent: 15
  storage:
    mock: ${STORAGE_MOCK:true}
    base-url: ${STORAGE_BASE_URL:http://localhost:8080/files}
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
  push:
    mock: ${PUSH_MOCK:true}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.worknear: DEBUG
